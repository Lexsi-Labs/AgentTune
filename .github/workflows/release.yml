name: Create release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create new release
        run: python3 .github/scripts/release.py
        env:
          # A PAT (not GITHUB_TOKEN) is required so the created release triggers
          # the "Publish to PyPI" workflow.
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
